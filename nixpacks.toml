# Pin a specific Deno release. Nixpacks' Deno provider installs an *unpinned*
# `deno` from its nixpkgs snapshot, and that build may not even expose
# Deno.openKv (the runtime's KV needs --unstable-kv on the 2.9.x builds we
# target). So we download the exact Deno we develop against (v2.9.7) into
# .runtime/ at build time and start the server with that binary.

providers = ["deno"]

[phases.setup]
nixPkgs = [
  "...", # keep the provider's `deno` nix package, extend with the two below
  "curl",
  "unzip",
]

[phases.build]
dependsOn = ["setup"]
cmds = [
  """
  set -euo pipefail
  mkdir -p .runtime
  case "$(uname -m)" in
    x86_64*)  arch="x86_64-unknown-linux-gnu" ;;
    aarch64*) arch="aarch64-unknown-linux-gnu" ;;
    *) echo "unsupported CPU architecture: $(uname -m)" >&2; exit 1 ;;
  esac
  url="https://dl.deno.land/release/v2.9.7/deno-${arch}.zip"
  echo "pinning Deno v2.9.7 (${arch})"
  curl -fsSL -o .runtime/deno.zip "$url"
  if command -v unzip >/dev/null 2>&1; then
    unzip -o -q .runtime/deno.zip -d .runtime
  else
    python3 -m zipfile -e .runtime/deno.zip .runtime
  fi
  rm -f .runtime/deno.zip
  chmod +x .runtime/deno
  ./.runtime/deno --version
  """,
]

[start]
# Deno.openKv needs the --unstable-kv flag on the 2.9.x builds we run.
cmd = "./.runtime/deno run --unstable-kv --allow-net --allow-read --allow-write --allow-env main.ts"
